<svg xmlns="http://www.w3.org/2000/svg" width="800" height="820" viewBox="0 0 800 820" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ha-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4B5563"/>
    </marker>
  </defs>

  <rect width="800" height="820" fill="#FFFFFF"/>
  <text x="400" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#111827">Hosted agents in Microsoft Foundry</text>

  <!-- CLIENTS -->
  <rect x="24" y="54" width="752" height="86" rx="9" fill="#F3F6FD" stroke="#4285F4" stroke-width="2"/>
  <text x="34" y="74" font-size="14" font-weight="700" fill="#1A56DB">YOUR CLIENTS</text>
  <rect x="24" y="84" width="179" height="48" rx="7" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="113" y="113" text-anchor="middle" font-size="14" font-weight="600" fill="#111827">Apps and SDKs</text>
  <rect x="215" y="84" width="179" height="48" rx="7" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="304" y="113" text-anchor="middle" font-size="14" font-weight="600" fill="#111827">Foundry portal</text>
  <rect x="406" y="84" width="179" height="48" rx="7" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="495" y="113" text-anchor="middle" font-size="14" font-weight="600" fill="#111827">Teams and Microsoft 365</text>
  <rect x="597" y="84" width="179" height="48" rx="7" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text x="686" y="113" text-anchor="middle" font-size="14" font-weight="600" fill="#111827">Webhooks, voice</text>

  <!-- PROTOCOLS -->
  <line x1="113" y1="140" x2="113" y2="192" stroke="#4B5563" stroke-width="2" marker-end="url(#ha-arrow)"/>
  <text x="122" y="162" font-size="14" font-weight="700" fill="#1A56DB">Responses or</text>
  <text x="122" y="180" font-size="14" font-weight="700" fill="#1A56DB">Invocations</text>
  <line x1="304" y1="140" x2="304" y2="192" stroke="#4B5563" stroke-width="2" marker-end="url(#ha-arrow)"/>
  <text x="313" y="171" font-size="14" font-weight="700" fill="#1A56DB">Responses</text>
  <line x1="495" y1="140" x2="495" y2="192" stroke="#4B5563" stroke-width="2" marker-end="url(#ha-arrow)"/>
  <text x="504" y="162" font-size="14" font-weight="700" fill="#1A56DB">Activity</text>
  <text x="504" y="180" font-size="14" fill="#4B5563">bridged</text>
  <line x1="686" y1="140" x2="686" y2="192" stroke="#4B5563" stroke-width="2" marker-end="url(#ha-arrow)"/>
  <text x="695" y="162" font-size="14" font-weight="700" fill="#1A56DB">Invocations</text>
  <text x="695" y="180" font-size="14" fill="#4B5563">(WebSocket)</text>

  <!-- ENDPOINT -->
  <rect x="24" y="194" width="752" height="62" rx="9" fill="#D6E4FF" stroke="#1A56DB" stroke-width="2"/>
  <text x="400" y="222" text-anchor="middle" font-size="16" font-weight="700" fill="#111827">Dedicated agent endpoint, created at deploy time</text>
  <text x="400" y="244" text-anchor="middle" font-size="14" font-weight="600" fill="#1A56DB">authenticated with Microsoft Entra ID</text>

  <!-- PLATFORM -->
  <rect x="24" y="268" width="752" height="142" rx="9" fill="#EEF4FF" stroke="#1A56DB" stroke-width="2"/>
  <text x="34" y="288" font-size="14" font-weight="700" fill="#1A56DB">FOUNDRY AGENT SERVICE, MANAGED FOR YOU</text>

  <rect x="24" y="296" width="179" height="106" rx="8" fill="#FFFFFF" stroke="#1A56DB" stroke-width="1.5"/>
  <text x="113" y="320" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">Container image</text>
  <text x="113" y="345" text-anchor="middle" font-size="14" fill="#374151">pulled from Azure</text>
  <text x="113" y="367" text-anchor="middle" font-size="14" fill="#374151">Container Registry</text>
  <text x="113" y="389" text-anchor="middle" font-size="14" fill="#374151">Python or C#</text>

  <rect x="215" y="296" width="179" height="106" rx="8" fill="#FFFFFF" stroke="#1A56DB" stroke-width="1.5"/>
  <text x="304" y="320" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">Agent versions</text>
  <text x="304" y="345" text-anchor="middle" font-size="14" fill="#374151">immutable</text>
  <text x="304" y="367" text-anchor="middle" font-size="14" fill="#374151">snapshots</text>
  <text x="304" y="389" text-anchor="middle" font-size="14" fill="#374151">one served at a time</text>

  <rect x="406" y="296" width="179" height="106" rx="8" fill="#FFFFFF" stroke="#1A56DB" stroke-width="1.5"/>
  <text x="495" y="320" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">Agent identity</text>
  <text x="495" y="345" text-anchor="middle" font-size="14" fill="#374151">its own Entra ID</text>
  <text x="495" y="367" text-anchor="middle" font-size="14" fill="#374151">created at deploy</text>
  <text x="495" y="389" text-anchor="middle" font-size="14" fill="#374151">time</text>

  <rect x="597" y="296" width="179" height="106" rx="8" fill="#FFFFFF" stroke="#1A56DB" stroke-width="1.5"/>
  <text x="686" y="320" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">Conversations</text>
  <text x="686" y="345" text-anchor="middle" font-size="14" fill="#374151">durable history</text>
  <text x="686" y="367" text-anchor="middle" font-size="14" fill="#374151">outlives compute</text>

  <line x1="400" y1="410" x2="400" y2="452" stroke="#4B5563" stroke-width="2" marker-end="url(#ha-arrow)"/>
  <text x="410" y="436" font-size="14" font-weight="600" fill="#4B5563">starts or resumes a session</text>

  <!-- RUNTIME -->
  <rect x="24" y="454" width="752" height="162" rx="9" fill="#E9F8F1" stroke="#057A55" stroke-width="2"/>
  <text x="34" y="474" font-size="14" font-weight="700" fill="#057A55">HOSTED AGENT RUNTIME</text>

  <rect x="24" y="482" width="360" height="126" rx="8" fill="#FFFFFF" stroke="#057A55" stroke-width="1.5"/>
  <text x="204" y="506" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">Per-session, VM-isolated sandbox</text>
  <text x="204" y="532" text-anchor="middle" font-size="14" fill="#374151">runs your container code</text>
  <text x="204" y="555" text-anchor="middle" font-size="14" fill="#374151">$HOME and /files persist</text>
  <text x="204" y="578" text-anchor="middle" font-size="14" fill="#374151">across turns and idle periods</text>
  <text x="204" y="601" text-anchor="middle" font-size="14" fill="#374151">isolated from other sessions</text>

  <rect x="400" y="482" width="376" height="126" rx="8" fill="#FFFFFF" stroke="#057A55" stroke-width="1.5"/>
  <text x="588" y="506" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">Session lifecycle</text>
  <text x="521" y="524" text-anchor="middle" font-size="14" fill="#4B5563">15 min</text>
  <text x="655" y="524" text-anchor="middle" font-size="14" fill="#4B5563">new call</text>
  <rect x="400" y="530" width="108" height="42" rx="7" fill="#DEF7EC" stroke="#057A55" stroke-width="1.5"/>
  <text x="454" y="557" text-anchor="middle" font-size="14" font-weight="700" fill="#111827">Active</text>
  <line x1="510" y1="551" x2="532" y2="551" stroke="#4B5563" stroke-width="2" marker-end="url(#ha-arrow)"/>
  <rect x="534" y="530" width="108" height="42" rx="7" fill="#DEF7EC" stroke="#057A55" stroke-width="1.5"/>
  <text x="588" y="557" text-anchor="middle" font-size="14" font-weight="700" fill="#111827">Idle</text>
  <line x1="644" y1="551" x2="666" y2="551" stroke="#4B5563" stroke-width="2" marker-end="url(#ha-arrow)"/>
  <rect x="668" y="530" width="108" height="42" rx="7" fill="#DEF7EC" stroke="#057A55" stroke-width="1.5"/>
  <text x="722" y="557" text-anchor="middle" font-size="14" font-weight="700" fill="#111827">Resumed</text>
  <text x="588" y="596" text-anchor="middle" font-size="14" fill="#374151">$HOME and /files survive the idle gap</text>

  <!-- arrows down -->
  <line x1="144" y1="616" x2="144" y2="660" stroke="#4B5563" stroke-width="2" marker-end="url(#ha-arrow)"/>
  <text x="153" y="642" font-size="14" font-weight="600" fill="#4B5563">agent identity</text>
  <line x1="400" y1="616" x2="400" y2="660" stroke="#4B5563" stroke-width="2" marker-end="url(#ha-arrow)"/>
  <text x="409" y="642" font-size="14" font-weight="600" fill="#4B5563">MCP</text>
  <line x1="656" y1="616" x2="656" y2="660" stroke="#4B5563" stroke-width="2" marker-end="url(#ha-arrow)"/>
  <text x="665" y="642" font-size="14" font-weight="600" fill="#4B5563">agent identity</text>

  <!-- DOWNSTREAM -->
  <rect x="24" y="662" width="240" height="118" rx="9" fill="#FDF6B2" stroke="#C27803" stroke-width="2"/>
  <text x="144" y="690" text-anchor="middle" font-size="16" font-weight="700" fill="#111827">Models</text>
  <text x="144" y="716" text-anchor="middle" font-size="14" fill="#374151">from the Foundry</text>
  <text x="144" y="738" text-anchor="middle" font-size="14" fill="#374151">model catalog</text>
  <text x="144" y="760" text-anchor="middle" font-size="14" fill="#374151">reachable by default</text>

  <rect x="280" y="662" width="240" height="118" rx="9" fill="#FDF6B2" stroke="#C27803" stroke-width="2"/>
  <text x="400" y="690" text-anchor="middle" font-size="16" font-weight="700" fill="#111827">Toolbox</text>
  <text x="400" y="716" text-anchor="middle" font-size="14" fill="#374151">one MCP endpoint</text>
  <text x="400" y="738" text-anchor="middle" font-size="14" fill="#374151">for the whole project</text>
  <text x="400" y="760" text-anchor="middle" font-size="14" fill="#374151">all tools live here</text>

  <rect x="536" y="662" width="240" height="118" rx="9" fill="#FDF6B2" stroke="#C27803" stroke-width="2"/>
  <text x="656" y="690" text-anchor="middle" font-size="16" font-weight="700" fill="#111827">Your Azure services</text>
  <text x="656" y="716" text-anchor="middle" font-size="14" fill="#374151">databases and APIs</text>
  <text x="656" y="738" text-anchor="middle" font-size="14" fill="#374151">your virtual network</text>
  <text x="656" y="760" text-anchor="middle" font-size="14" fill="#374151">RBAC on agent identity</text>

  <text x="400" y="806" text-anchor="middle" font-size="14" fill="#6B7280">Plus a dedicated Entra agent identity and OpenTelemetry traces in Application Insights</text>
</svg>
